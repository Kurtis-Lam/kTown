      type="image/png"
      href="/imgs/logos/krevisionnotes.png?v=3"
    />
    <script>
      (function () {
        try {
          var t =
            localStorage.getItem("kr:theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.dataset.theme = t;
          var z = localStorage.getItem("kr:size");
          if (z)
            document.documentElement.style.setProperty(
              "--fs",
              [15, 16, 17, 18, 19, 20, 22][+z] + "px",
            );
        } catch (e) {}
      })();
    </script>
