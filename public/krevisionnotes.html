<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kRevisionNotes — kTown</title>
  <meta name="description" content="Explore clear IB topic notes, worked examples and practice questions in kRevisionNotes by kTown.">
  <link rel="icon" href="imgs/logo.png" type="image/png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/notes-tidy.css">

  <script defer src="vendor/katex/katex.min.js"></script>

  <script defer src="js/data/econ.js"></script>
  <script defer src="js/data/chem.js"></script>
  <script defer src="js/data/geo.js"></script>
  <script defer src="js/data/physics.js"></script>

  <script defer src="js/data/bio.js"></script>

  <script defer src="js/data/econ-plus.js"></script>
  <script defer src="js/data/chem-plus.js"></script>
  <script defer src="js/data/geo-plus.js"></script>
  <script defer src="js/data/geo-hl.js"></script>
  <script defer src="js/data/math-plus.js"></script>
  <script defer src="js/data/bio-plus.js"></script>
  <script defer src="js/data/engb-plus.js"></script>
  <script defer src="js/data/chia-plus.js"></script>

  <script defer src="js/data/chem-bank.js"></script>

  <script defer src="js/data/chia-bank.js"></script>

  <script defer src="js/bankbuild.js"></script>
  <script defer src="js/plot.js"></script>
  <script defer src="js/motion.js"></script>
  <script defer src="js/pdfnotes.js"></script>
  <script defer src="js/notes.js"></script>

  <!-- Accounts / cloud sync -->
  <script type="module" src="js/auth.js"></script>
</head>
<body data-page="notes">
  <!-- The animated background iframe, header and footer are added by js/app.js,
       so none is repeated here (the old page had two stacked backgrounds). -->
  <main class="container page-main" id="app">
    <noscript><p>kRevisionNotes needs JavaScript to load your notes.</p></noscript>
  </main>
