<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kCiteThisForMe — Instant APA 7 Citation Generator</title>
  <link rel="icon" href="/imgs/logos/kcitethisforme.png" type="image/png" />
  <link rel="stylesheet" href="/kcitethisforme/css/tailwind.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/kcitethisforme/css/style.css" />
</head>
<body class="bg-transparent text-slate-100 dark:text-slate-100 light:text-slate-900 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">


  <header class="bg-[#07090e]/80 dark:bg-[#07090e]/80 light:bg-white/80 border-b border-white/10 light:border-slate-200 sticky top-0 z-30 transition-colors">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <a href="/kcitethisforme/" class="flex items-center space-x-3 group">
        <img src="/imgs/logos/kcitethisforme.png" alt="kCiteThisForMe" width="40" height="40" class="w-10 h-10 rounded-xl group-hover:scale-105 transition-transform" />
        <div class="flex flex-col">
          <span class="text-xl font-extrabold tracking-tight text-white light:text-slate-900">kCiteThisForMe</span>
          <span class="text-[10px] text-purple-400 font-semibold tracking-widest uppercase">Part of kTown Suite</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full bg-purple-500/10 text-purple-300 border border-purple-500/30 light:bg-purple-50 light:text-purple-700 light:border-purple-200">
          <i class="fa-solid fa-graduation-cap"></i> APA 7th Edition
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-10 flex-grow w-full">
    <div class="bg-[#121826]/90 light:bg-white/90 rounded-3xl border border-white/10 light:border-slate-200 p-6 sm:p-10 mb-8 shadow-2xl relative overflow-hidden">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gradient-to-r from-purple-500/10 to-pink-500/10 border border-purple-500/30 text-purple-300 light:text-purple-700 text-xs font-semibold mb-4">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Instant Citation Generator
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3 text-white light:text-slate-900">
        Cite Websites in Seconds
      </h1>
      <p class="text-slate-400 light:text-slate-600 text-sm sm:text-base mb-8 max-w-2xl leading-relaxed">
        Paste any article or webpage URL below to extract metadata automatically and format accurate APA 7th Edition citations.
      </p>

      <form id="citeForm" class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <input 
              type="url" 
              id="urlInput" 
              placeholder="https://example.com/article-name" 
              required
              class="w-full px-4 py-4 pl-12 rounded-2xl bg-black/40 light:bg-slate-50 border border-white/10 light:border-slate-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition text-white light:text-slate-900 placeholder-slate-500 text-sm sm:text-base"
            />
            <i class="fa-solid fa-link absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          </div>
          <button 
            type="submit" 
            id="submitBtn"
            class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 active:scale-[0.98] text-white font-semibold px-8 py-4 rounded-2xl transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-purple-600/30 whitespace-nowrap cursor-pointer"
          >
            <span id="btnText">Cite Website</span>
            <svg id="spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </div>
      </form>
      <div id="errorMessage" class="mt-3 text-xs text-rose-400 light:text-rose-600 hidden flex items-center gap-1.5">
        <i class="fa-solid fa-circle-exclamation"></i> <span></span>
      </div>
    </div>

    <div id="outputContainer" class="hidden space-y-6">
      <div class="bg-gradient-to-br from-purple-950/80 to-slate-900/90 light:from-slate-900 light:to-indigo-950 text-white rounded-3xl p-6 sm:p-8 shadow-2xl border border-purple-500/30 relative overflow-hidden">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
          <span class="text-xs font-bold tracking-wider uppercase text-purple-300 flex items-center gap-2">
            <i class="fa-solid fa-check-circle text-emerald-400"></i> Formatted Reference (APA 7)
          </span>
          <button 
            id="copyBtn" 
            class="bg-white/10 hover:bg-white/20 active:scale-95 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2 border border-white/10 cursor-pointer"
          >
            <i class="fa-regular fa-copy"></i>
            <span id="copyBtnText">Copy Citation</span>
          </button>
        </div>
        <div id="formattedCitation" class="text-base sm:text-lg leading-relaxed font-serif tracking-wide pl-8 -indent-8 text-slate-100 py-2">
        </div>
      </div>

      <div class="bg-[#121826]/90 light:bg-white/90 rounded-3xl border border-white/10 light:border-slate-200 p-6 sm:p-8">
        <h3 class="text-xs font-bold text-purple-400 light:text-purple-700 mb-5 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i> Adjust Metadata
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-medium text-slate-300 light:text-slate-700 mb-1.5">Author / Organization</label>
            <input type="text" id="editAuthor" class="edit-field w-full px-4 py-2.5 text-sm bg-black/40 light:bg-slate-50 text-white light:text-slate-900 border border-white/10 light:border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 light:text-slate-700 mb-1.5">Publication / Update Date</label>
            <input type="text" id="editDate" placeholder="YYYY, Month DD or n.d." class="edit-field w-full px-4 py-2.5 text-sm bg-black/40 light:bg-slate-50 text-white light:text-slate-900 border border-white/10 light:border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 light:text-slate-700 mb-1.5">Page / Article Title</label>
            <input type="text" id="editTitle" class="edit-field w-full px-4 py-2.5 text-sm bg-black/40 light:bg-slate-50 text-white light:text-slate-900 border border-white/10 light:border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 light:text-slate-700 mb-1.5">Website Name</label>
            <input type="text" id="editSiteName" class="edit-field w-full px-4 py-2.5 text-sm bg-black/40 light:bg-slate-50 text-white light:text-slate-900 border border-white/10 light:border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
          </div>
        </div>
      </div>
    </div>

    <div id="historySection" class="mt-12 hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-white light:text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-purple-400"></i> Recent Citations
        </h2>
        <button id="clearHistoryBtn" class="text-xs text-slate-400 hover:text-rose-400 transition cursor-pointer">Clear History</button>
      </div>
      <div id="historyList" class="space-y-3"></div>
    </div>
  </main>


  <script src="/kcitethisforme/js/app.js"></script>

  <script src="/shell.js" defer></script>
</body>
</html>
